  <path d="M15 3.2 C21.8 3.0 27.2 8.2 27.0 15.1 C26.8 21.9 21.6 27.1 14.8 26.9 C8.0 26.7 2.9 21.4 3.1 14.6 C3.3 8.2 8.3 3.4 14.6 3.2"
        fill="none" stroke="#bf3d27" stroke-width="3" stroke-linecap="round"/>
</svg>
