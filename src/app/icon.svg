<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 30" width="32" height="32">
  <!--
    The Merope mark. Kept in sync by hand with src/design/components/Mark.tsx —
    a static export has no way to render the component to a file, and
    tests/design.test.ts asserts the two paths stay identical.

    Colours are literal rather than tokens: a favicon renders outside the
    document and cannot see CSS variables. These are the plate-theme values,
    which read correctly against both light and dark browser chrome.
  -->
